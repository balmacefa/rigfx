<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>rigfx arena — play with the rig</title>
<style>
:root{--bg:#0f0e14;--card:#1a1824;--ink:#e9e6f5;--mut:#9a95b3;--acc:#ffb84a;--hp:#6cca4e;--dmg:#ff5a5a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,Segoe UI,sans-serif;text-align:center}
header{max-width:900px;margin:0 auto;padding:18px}h1{margin:.2em 0}h1 span{color:var(--acc)}a{color:var(--acc)}
.arena{display:flex;justify-content:space-around;align-items:flex-end;max-width:720px;margin:10px auto;gap:12px;position:relative}
.fighter{background:var(--card);border-radius:12px;padding:10px;width:46%;position:relative}
.fighter img{width:100%;image-rendering:pixelated;background:#14121c;border-radius:8px;transition:filter .1s}
.bar{height:12px;background:#38344d;border-radius:6px;overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:var(--hp);transition:width .25s}
.moves{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:720px;margin:12px auto}
button{background:var(--card);color:var(--ink);border:1px solid #38344d;border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit;transition:all .15s;position:relative}
button:hover{border-color:var(--acc);transform:translateY(-1px)}button:disabled{opacity:.4;cursor:default}
button kbd{position:absolute;top:2px;right:4px;font-size:10px;color:var(--acc);background:#38344d;padding:1px 4px;border-radius:3px;font-family:monospace}
button:active,button.pressed{background:var(--acc);color:var(--bg);border-color:var(--acc);transform:scale(.95)}
#msg{min-height:1.4em;color:var(--mut)}#score{color:var(--acc);font-weight:bold}
#combo{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:48px;font-weight:bold;color:var(--acc);text-shadow:0 0 20px var(--acc);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
#combo.show{opacity:1}
#combo.mega{font-size:72px;color:#ff40ff;text-shadow:0 0 30px #ff40ff,0 0 60px #ff40ff}
.combo-info{color:var(--acc);font-size:14px;margin-top:4px}
kbd{background:var(--card);border:1px solid #38344d;border-radius:3px;padding:2px 6px;font-size:.9em;font-family:monospace}
.crit{color:#ff40ff;font-weight:bold;text-shadow:0 0 8px #ff40ff}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes flash{0%,100%{filter:brightness(1)}50%{filter:brightness(2.5) saturate(0)}}
.shake{animation:shake .4s ease-in-out}
.flash{animation:flash .3s ease-in-out}
#picker{position:fixed;inset:0;background:rgba(15,14,20,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;padding:20px;overflow-y:auto}
#picker h2{color:var(--acc);margin:10px 0 20px}
#picker .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;max-width:800px;width:100%}
#picker .char-card{background:var(--card);border:2px solid #38344d;border-radius:8px;padding:8px;cursor:pointer;transition:all .2s;text-align:center}
#picker .char-card:hover{border-color:var(--acc);transform:translateY(-3px);box-shadow:0 4px 12px rgba(255,184,74,.3)}
#picker .char-card img{width:100%;image-rendering:pixelated;background:#14121c;border-radius:4px;margin-bottom:6px}
#picker .char-card .name{font-size:13px;color:var(--mut);text-transform:capitalize}
</style></head><body>
<header><h1>rigfx <span>arena</span></h1>
<p>Pick a move to attack (or use keys <kbd>1</kbd>-<kbd>9</kbd>, <kbd>0</kbd>, <kbd>-</kbd>, <kbd>=</kbd>). Beat a foe and a new rig steps in. Wins: <span id="score">0</span></p>
<p><a href="/">&larr; back to rigfx</a></p></header>
<div class="arena" id="arena">
  <div id="combo"></div>
  <div class="fighter"><div id="hname">you</div><img id="hero" alt="hero"/><div class="bar"><i id="hhp" style="width:100%"></i></div><div class="combo-info" id="combotext"></div></div>
  <div class="fighter"><div id="ename">foe</div><img id="foe" alt="foe"/><div class="bar"><i id="ehp" style="width:100%"></i></div></div>
</div>
<div id="msg">loading the roster…</div>
<div class="moves" id="moves"></div>
<script>
const MOVES=["sword-combo","fireball-throw","ice-lance-throw","lightning-call","meteor-call","ground-pound","rocket-launcher","holy-smite","dash-strike","earth-stomp","arrow-shot","pistol-shots"];
const gif=(c,m)=>`media/${c}-${m}.gif`;
let chars=[],hero,foe,hhp=100,ehp=100,score=0,busy=false,picked=false,combo=0;
const $=s=>document.getElementById(s);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function setFoe(){foe=rnd(chars.filter(c=>c!==hero));ehp=100;$("ename").textContent=foe;$("foe").src=gif(foe,"sword-combo");$("ehp").style.width="100%";}
function newGame(){if(!picked)return;setFoe();hhp=100;combo=0;updateCombo();$("hname").textContent=hero;$("hero").src=gif(hero,"sword-combo");$("hhp").style.width="100%";$("score").textContent=score;}
function showPicker(){const p=document.createElement('div');p.id='picker';p.innerHTML='<h2>choose your fighter</h2><div class="grid">'+chars.map(c=>`<div class="char-card" onclick="selectChar('${c}')"><img src="${gif(c,'sword-combo')}" alt="${c}"/><div class="name">${c}</div></div>`).join('')+'</div>';document.body.appendChild(p);}
function selectChar(c){hero=c;picked=true;document.getElementById('picker').remove();newGame();$("msg").textContent="fight!";}
function play(img,c,m){img.src=gif(c,m)+"?x="+Math.random();}
function updateCombo(){const ct=$("combotext");if(combo===0){ct.textContent="";}else{const mult=Math.min(1+combo*0.25,3).toFixed(2);ct.textContent=`COMBO x${combo} (${mult}x dmg)`;if(combo>=8){ct.style.color="#ff40ff";ct.style.textShadow="0 0 8px #ff40ff";}else{ct.style.color="var(--acc)";ct.style.textShadow="none";}}}
function showCombo(){const c=$("combo");c.textContent=`${combo} HIT COMBO!`;c.className=combo>=8?"show mega":"show";setTimeout(()=>c.classList.remove("show","mega"),800);}
async function attack(m){if(busy)return;busy=true;
  play($("hero"),hero,m);combo++;updateCombo();if(combo>1)showCombo();const mult=Math.min(1+combo*0.25,3);let dmg=Math.floor((12+Math.random()*18)*mult);const isCrit=Math.random()<0.18;if(isCrit){dmg=Math.floor(dmg*1.75);}ehp=Math.max(0,ehp-dmg);$("ehp").style.width=ehp+"%";
  const foeEl=$("foe").parentNode;foeEl.classList.add("flash");$("arena").classList.add("shake");setTimeout(()=>{foeEl.classList.remove("flash");$("arena").classList.remove("shake");},400);
  $("msg").innerHTML=isCrit?`<span class="crit">CRITICAL HIT!</span> you used ${m.replace(/-/g," ")} (-${dmg})`:`you used ${m.replace(/-/g," ")} (-${dmg})`;
  await new Promise(r=>setTimeout(r,650));
  if(ehp<=0){score++;$("score").textContent=score;$("msg").textContent=`${foe} down! a new challenger…`;await new Promise(r=>setTimeout(r,700));setFoe();busy=false;return;}
  const em=rnd(MOVES);play($("foe"),foe,em);let edmg=8+Math.floor(Math.random()*14);const eCrit=Math.random()<0.18;if(eCrit){edmg=Math.floor(edmg*1.75);}hhp=Math.max(0,hhp-edmg);$("hhp").style.width=hhp+"%";
  const heroEl=$("hero").parentNode;heroEl.classList.add("flash");$("arena").classList.add("shake");setTimeout(()=>{heroEl.classList.remove("flash");$("arena").classList.remove("shake");},400);
  const prevCombo=combo;combo=0;updateCombo();const comboLost=prevCombo>2?` (COMBO BROKEN!)`:``;$("msg").innerHTML=eCrit?`<span class="crit">CRITICAL HIT!</span> ${foe} hits back with ${em.replace(/-/g," ")} (-${edmg})${comboLost}`:`${foe} hits back with ${em.replace(/-/g," ")} (-${edmg})${comboLost}`;
  await new Promise(r=>setTimeout(r,650));
  if(hhp<=0){$("msg").textContent=`you fell after ${score} wins. restarting…`;score=0;await new Promise(r=>setTimeout(r,900));newGame();}
  busy=false;}
$("moves").innerHTML=MOVES.map((m,i)=>{const keys=['1','2','3','4','5','6','7','8','9','0','-','='];return`<button id="btn${i}" onclick="attack('${m}')">${m.replace(/-/g," ")}<kbd>${keys[i]}</kbd></button>`;}).join("");
document.addEventListener('keydown',e=>{const keys=['1','2','3','4','5','6','7','8','9','0','-','='];const idx=keys.indexOf(e.key);if(idx!==-1&&idx<MOVES.length){const btn=$("btn"+idx);if(!busy&&btn){btn.classList.add('pressed');attack(MOVES[idx]);setTimeout(()=>btn.classList.remove('pressed'),150);}}});
fetch("media/chars.json").then(r=>r.json()).then(c=>{chars=Object.keys(c);showPicker();}).catch(e=>{$("msg").textContent="could not load roster";});
</script></body></html>
